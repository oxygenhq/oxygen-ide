<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Oxygen IDE</title>
    <script>
      // Pick light/dark before anything paints. The main process has already applied the saved
      // choice to nativeTheme, which is what this media query reflects. ThemeProvider
      // (components/ThemeProvider.jsx) takes over once React has rendered.
      (function() {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { /* default (light) styling applies */ }
      }());
    </script>
    <script>
      (function() {
        if (!process.env.HOT) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '../dist/style.css';
          // HACK: Writing the script path should be done with webpack
          document.getElementsByTagName('head')[0].appendChild(link);
        }
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
        // Dynamically insert the DLL script in development env in the renderer process
        if (process.env.NODE_ENV === 'development') {
          document.write('<script defer src="../../dll/renderer.dev.dll.js"><\/script>');
        }

        // Dynamically insert the bundled app script in the renderer process
        var rndr = (process.env.HOT)
            ? 'http://localhost:' + (process.env.PORT || 1212) + '/dist/renderer.dev.js'
            : '../dist/renderer.prod.js';

        document.write('<script defer src="' + rndr + '"><\/script>');
    </script>
  </body>
</html>
